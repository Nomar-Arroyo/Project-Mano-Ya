# ======================================================================
# Mano Ya · Configuracion de Supabase (CLI)
# ----------------------------------------------------------------------
# Configuracion local y opciones de despliegue de Edge Functions.
#
# Comandos utiles:
#   supabase link --project-ref waxypsqomsljcljdqwra
#   supabase functions deploy notify-report --no-verify-jwt
# supabase secrets set RESEND_API_KEY=... RESEND_FROM_EMAIL=... APP_ORIGIN=...
# ======================================================================

project_id = "mano-ya"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Código de verificación de Mano Ya"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recupera tu contraseña en Mano Ya"
content_path = "./supabase/templates/recovery.html"

# ----------------------------------------------------------------------
# Edge Function que envia los reportes por correo (Resend).
#
# verify_jwt = false para que la funcion admita tanto el POST autenticado de
# n8n (`x-webhook-secret`) como la sesion Supabase validada dentro de la
# funcion para solicitudes creadas desde Flutter.
# ----------------------------------------------------------------------
[functions.notify-report]
verify_jwt = false

# Las recomendaciones requieren una sesión de Supabase; la función también
# valida el token antes de consultar catálogo o utilizar Ollama.
[functions.recommend-workers]
verify_jwt = true

# La funcion guarda la aceptacion y sus metadatos de auditoria.
[functions.accept-terms]
verify_jwt = true

# Envía al cliente autenticado la ficha del trabajador mediante Resend.
[functions.send-worker-contact-card]
verify_jwt = true
